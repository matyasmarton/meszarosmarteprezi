[build]
  publish = "."

[build.environment]
  GIT_LFS_ENABLED = "true"
  GIT_LFS_FETCH_INCLUDE = "*.png,*.jpg,*.jpeg,*.pdf,*.mp4,*.mov"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Content-Type = "video/mp4"

[[headers]]
  for = "*.mov"
  [headers.values]
    Content-Type = "video/quicktime"

[[headers]]
  for = "orokbefogadas_kepek/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "1975_4sz.pdf"
  [headers.values]
    Content-Type = "application/pdf"
